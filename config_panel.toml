#:schema https://github.com/YunoHost/apps/raw/main/schemas/config_panel.v1.schema.json

version = "1.0"

[main]
name.en = "OpenCode configuration"
services = ["__APP__"]

    [main.info]
    ask.en = "API keys are stored in auth.json and picked up by opencode. After saving, the service will restart."
    type = "alert"
    style = "info"

    [main.official]
    name.en = "OpenCode Official"

        [main.official.opencode]
        ask.en = "OpenCode Zen API Key"
        type = "password"
        bind = "opencode>key:__INSTALL_DIR__/.local/share/opencode/auth.json"

        [main.official.opencode_go]
        ask.en = "OpenCode Go API Key"
        type = "password"

    [main.major]
    name.en = "Major Providers"

        [main.major.openai]
