#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "opencode"
name = "OpenCode"
description.en = "AI coding agent with a web interface"
description.fr = "Agent de codage IA avec une interface web"

version = "1.17.9~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://opencode.ai"
admindoc = "https://opencode.ai/docs"
userdoc = "https://opencode.ai/docs/web"
code = "https://github.com/anomalyco/opencode"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = "true"
sso = "true"
disk = "200M"
ram.build = "50M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "all_users"


[resources]
    [resources.sources]

        [resources.sources.main]
        url = "https://github.com/anomalyco/opencode/releases/download/v1.17.9/opencode-linux-x64.tar.gz"
        sha256 = "85aeac95258d409d16ca34f1cfcd74c78d9d1a70b0a4154128b588e1405384f9"
        autoupdate.strategy = "latest_github_tag"
        in_subdir = false

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
